<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>بطاقة نهى ابراهيم علي</title>
<style>
:root{color-scheme:dark;--g:#d9b66d;--g2:#f6e3a5}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;padding:24px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 12%,#282116,#11100e 38%,#050505);color:#f7f0df;font-family:Tahoma,Arial,sans-serif}
.card{position:relative;isolation:isolate;overflow:hidden;width:min(100%,520px);min-height:270px;border:1px solid rgba(230,194,112,.8);border-radius:20px;padding:clamp(22px,5.5vw,38px);display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#191713,#080808 45%,#211b10);box-shadow:0 24px 65px #0009,inset 0 0 0 5px #d9b66d12,inset 0 0 35px #d9b66d10}
.card:before{content:"";position:absolute;z-index:-1;width:245px;height:245px;border-radius:50%;border:1px solid #d9b66d3d;top:-110px;left:-70px;box-shadow:0 0 0 15px #d9b66d09,0 0 0 32px #d9b66d08,0 0 0 52px #d9b66d06}
.card:after{content:"";position:absolute;z-index:-1;right:0;bottom:0;width:100%;height:4px;background:linear-gradient(90deg,transparent,var(--g),var(--g2),var(--g),transparent)}
.top,.foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{width:48px;height:48px;border:1px solid var(--g);border-radius:50%;display:grid;place-items:center;color:var(--g2);font:24px Georgia}
.brand{color:var(--g);font-size:10px;letter-spacing:3px;direction:ltr}
.name{margin:14px 0 8px;font-size:clamp(23px,5.5vw,35px);font-weight:bold;line-height:1.4;color:#fff7e4}
.rule{width:70px;height:2px;background:linear-gradient(90deg,var(--g2),transparent);margin:13px 0 15px auto}
.details{display:grid;gap:9px}
.line{display:flex;align-items:center;gap:10px;direction:ltr;color:var(--g2);font-size:clamp(13px,3.2vw,16px);overflow-wrap:anywhere}
.line.email{font-size:clamp(12px,3vw,15px)}
.ico{width:28px;height:28px;display:grid;place-items:center;border:1px solid #d9b66d8c;border-radius:50%;flex-shrink:0;font-size:14px}
.foot{margin-top:12px}.tag{color:#b8ad96;font-size:10px;letter-spacing:2px}.star{color:var(--g);font-size:21px}
.actions{width:min(100%,520px);display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--g);padding:13px 12px;display:flex;justify-content:center;align-items:center;gap:9px;text-decoration:none;font:600 14px Tahoma,Arial,sans-serif;cursor:pointer}
.save{color:#17120a;background:linear-gradient(135deg,var(--g2),var(--g))}
.wa{color:var(--g2);background:#0a0a0aa6}
.note{width:min(100%,520px);color:#8f8879;text-align:center;font-size:11px;line-height:1.7;margin:0}
@media(max-width:390px){body{padding:16px 10px}.card{padding:20px;border-radius:16px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card" aria-label="بطاقة اتصال نهى ابراهيم علي">
 <div class="top"><div class="mark">ن</div><div class="brand">PERSONAL CONTACT</div></div>
 <div>
  <div class="name">نهى ابراهيم علي</div><div class="rule"></div>
  <div class="details">
   <div class="line"><span class="ico">☎</span><span>+249 127 169 314</span></div>
   <div class="line email"><span class="ico">✉</span><span>nun_ali@hotmail.com</span></div>
  </div>
 </div>
 <div class="foot"><span class="tag">ELEGANCE • CONNECTION</span><span class="star">✦</span></div>
</main>
<section class="actions" aria-label="خيارات الاتصال">
 <button class="btn save" id="save" type="button">⇩　حفظ جهة الاتصال</button>
 <a class="btn wa" href="https://wa.me/249127169314" target="_blank" rel="noopener noreferrer">☏　مراسلة واتساب</a>
</section>
<p class="note">بطاقة رقمية متجاوبة مع جميع الأجهزة. يحفظ زر الاتصال الاسم والرقم والبريد الإلكتروني في ملف VCF.</p>

 const u=URL.createObjectURL(new Blob([v],{type:'text/vcard;charset=utf-8'}));

});
</script>
</body></html>
